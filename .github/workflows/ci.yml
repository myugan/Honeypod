name: CI

# Runs the test suite on every push and pull request. On a push to main,
# once tests pass, also builds the two images this project actually owns
# and pushes them to GHCR as ghcr.io/<owner>/honeypod/<name>, tagged both
# :latest and the commit SHA. The SHA tag is what lets you revert: pull an
# older <name>:<sha> instead of rebuilding locally if a later main push
# turns out bad.
#
# kine and kube-apiserver are not built here. Both spec defaults already
# point straight at the upstream images (rancher/kine, registry.k8s.io/
# kube-apiserver), so there is nothing of ours to publish. The repackaged
# Dockerfiles stay in the repo for anyone who wants the non-root variants,
# see the repo docs.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Set up envtest binaries
        id: envtest
        run: echo "kubebuilder-assets=$($(go env GOPATH)/bin/setup-envtest use 1.31.0 -p path)" >> "$GITHUB_OUTPUT"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest.outputs.kubebuilder-assets }}
        run: go test ./... -count=1

      # End-to-end tests start the real manager against envtest. They are
      # build-tagged `e2e` so the default `go test ./...` above stays fast.
      - name: e2e
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest.outputs.kubebuilder-assets }}
        run: go test -tags e2e ./test/e2e/... -count=1

      # The CRDs and the two bundles in manifests/ are generated. This
      # rebuilds them and fails if the result differs from what is
      # committed, so a change to api/ or config/ can't land with the
      # bundles left behind.
      - name: Check generated manifests are up to date
        run: ./hack/update-manifests.sh --check

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: manager
            dockerfile: docker/Dockerfile.manager
          - name: kubelet-shim
            dockerfile: docker/Dockerfile.kubelet-shim
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase the image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/honeypod/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/honeypod/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
