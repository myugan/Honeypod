apiVersion: v1
kind: ServiceAccount
metadata:
  name: honeypod-manager
  namespace: honeypod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypod-controller-manager
  namespace: honeypod
  labels:
    app.kubernetes.io/name: honeypod-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honeypod-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honeypod-operator
    spec:
      serviceAccountName: honeypod-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: manager
        image: honeypod/manager:latest
        imagePullPolicy: IfNotPresent
        command: ["/manager"]
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        - name: audit-webhook
          containerPort: 9880
        - name: join-webhook
          containerPort: 9443
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: honeypod-controller-manager
  namespace: honeypod
  labels:
    app.kubernetes.io/name: honeypod-operator
spec:
  selector:
    app.kubernetes.io/name: honeypod-operator
  ports:
  - name: audit-webhook
    port: 9880
    targetPort: audit-webhook
  - name: metrics
    port: 8080
    targetPort: metrics
---
# The MutatingWebhookConfiguration behind the honeypod.io/join annotation:
# on Pod CREATE it overrides KUBERNETES_SERVICE_HOST/PORT and swaps in the
# decoy ServiceAccount token, so anything in that pod using the standard
# in-cluster config talks to the honeypot instead of the real cluster.
# See internal/controller/join_webhook.go.
apiVersion: v1
kind: Service
metadata:
  name: honeypod-webhook
  namespace: honeypod
  labels:
    app.kubernetes.io/name: honeypod-operator
spec:
  selector:
    app.kubernetes.io/name: honeypod-operator
  ports:
  - name: webhook
    port: 443
    targetPort: join-webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: honeypod-pod-join
  labels:
    app.kubernetes.io/name: honeypod-operator
webhooks:
- name: podjoin.honeypod.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  # Ignore, not Fail: a MutatingWebhookConfiguration's own selectors
  # (namespaceSelector/objectSelector) can't reliably express "only Pods
  # carrying the honeypod.io/join annotation" -- objectSelector matches
  # metadata.labels, not metadata.annotations -- so this webhook's rules
  # below necessarily match every Pod CREATE, cluster-wide, and the
  # annotation check happens inside the handler itself
  # (internal/controller/join_webhook.go's PodJoinMutator.MutatePod
  # returns a no-op patch when it's absent). With that broad a match,
  # failurePolicy must be Ignore: this webhook being briefly unreachable
  # (a manager rollout, a caBundle not patched in yet -- see
  # internal/controller/webhookcert.go) must never block ordinary pod
  # creation for the entire cluster.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  timeoutSeconds: 5
  clientConfig:
    service:
      name: honeypod-webhook
      namespace: honeypod
      path: /mutate-pods
      port: 443
    # Patched at every manager process start by
    # internal/controller.PatchMutatingWebhookCABundle (see
    # cmd/manager/main.go) -- the operator's webhook-serving CA is
    # generated once and persisted in a Secret
    # (internal/controller.EnsureWebhookServingCert), so it stays the same
    # across restarts, but a caBundle baked into this static manifest would
    # still never match it (the CA is only known once generated).
    # Left empty here deliberately; until the manager patches this in,
    # the apiserver can't complete TLS verification against this webhook
    # and (per failurePolicy: Ignore above) simply treats every admission
    # as allowed with no patch in the meantime.
    caBundle: ""
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
---
# A minimal Decoy in the operator namespace, so `kubectl apply -f
# manifests/quickstart.yaml` gives you a working honeypot in one shot. See
# the project README for what to do with it next.
apiVersion: honeypod.io/v1alpha1
kind: Decoy
metadata:
  name: demo
  namespace: honeypod
spec:
  fakeNodes:
  - name: demo-node-1
  fakePods:
  - name: checkout-api
    namespace: billing
    containers:
    - name: app
      image: internal-registry.example.com/checkout-api:1.4.2
    logLines:
    - "2026-01-01T00:00:00.000Z INFO  checkout-api starting, listening on :8080"
    - "2026-01-01T00:00:01.000Z INFO  connected to db=checkout-primary"
  fakeSecrets:
  - name: checkout-api-db-credentials
    namespace: billing
    data:
      username: checkout_svc
      password: hunter2-not-a-real-password
      host: checkout-primary.billing.svc.cluster.local
