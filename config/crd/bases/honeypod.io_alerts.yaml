---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: alerts.honeypod.io
spec:
  group: honeypod.io
  names:
    kind: Alert
    listKind: AlertList
    plural: alerts
    singular: alert
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.type
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Alert notifies a Provider when a Pod is joined by a Decoy, or when
          something notable happens inside one. It has no status: nothing
          reconciles it, it is read when an event fires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlertSpec defines what an Alert notifies on, and where.
            properties:
              eventTypes:
                description: |-
                  EventTypes to notify on. Defaults to both PodJoin and
                  AuditActivity.
                items:
                  description: AlertEventType is one kind of event an Alert can fire
                    on.
                  enum:
                  - PodJoin
                  - AuditActivity
                  type: string
                type: array
              excludeResources:
                description: |-
                  ExcludeResources lists API resources to always drop from
                  AuditActivity, on top of the built-in heuristic. Each entry is
                  "resource" (any subresource) or "resource/subresource" (e.g. "pods",
                  "pods/log").
                items:
                  type: string
                type: array
              excludeVerbs:
                description: |-
                  ExcludeVerbs lists audit verbs (e.g. "watch") to always drop from
                  AuditActivity, on top of the built-in heuristic.
                items:
                  type: string
                type: array
              includeAll:
                description: |-
                  IncludeAll alerts on every audit event, including the honeypot's own
                  internal traffic. Off by default, since that traffic is constant and
                  would drown out a real intruder. ExcludeVerbs and ExcludeResources
                  still apply on top.
                type: boolean
              providerRef:
                description: ProviderRef selects a same-namespace Provider to send
                  notifications to.
                properties:
                  secretRef:
                    description: |-
                      SecretRef, if set, overrides the Provider's own spec.secretRef --
                      this Secret's "address" key is used instead.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  type:
                    description: |-
                      Type matches the target Provider's spec.type. Exactly one Provider
                      of this type must exist in the namespace.
                    type: string
                required:
                - type
                type: object
              targets:
                description: |-
                  Targets lists which Decoy(s) this Alert watches. Empty means every
                  Decoy -- the intended shape for a single-decoy deployment, where one
                  Alert covers the sole decoy without naming it.
                items:
                  description: |-
                    DecoyTarget names one Decoy, or every Decoy in a namespace,
                    that an Alert or AuditSink applies to.
                  properties:
                    name:
                      description: Name of the Decoy, or "*" for every Decoy in Namespace.
                      type: string
                    namespace:
                      description: |-
                        Namespace the Decoy is in. Defaults to the Alert/AuditSink's own
                        namespace.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - providerRef
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
