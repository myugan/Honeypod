apiVersion: v1
kind: Service
metadata:
  name: honeypod-controller-manager
  namespace: honeypod
  labels:
    app.kubernetes.io/name: honeypod-operator
spec:
  selector:
    app.kubernetes.io/name: honeypod-operator
  ports:
  - name: audit-webhook
    port: 9880
    targetPort: audit-webhook
  - name: metrics
    port: 8080
    targetPort: metrics
