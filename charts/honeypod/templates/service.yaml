apiVersion: v1
kind: Service
metadata:
  name: {{ include "honeypod.fullname" . }}
  namespace: {{ include "honeypod.namespace" . }}
  labels:
    {{- include "honeypod.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "honeypod.selectorLabels" . | nindent 4 }}
  ports:
  - name: audit-webhook
    port: 9880
    targetPort: audit-webhook
  - name: metrics
    port: 8080
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "honeypod.fullname" . }}-webhook
  namespace: {{ include "honeypod.namespace" . }}
  labels:
    {{- include "honeypod.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "honeypod.selectorLabels" . | nindent 4 }}
  ports:
  - name: webhook
    port: 443
    targetPort: join-webhook
