apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "honeypod.fullname" . }}-manager
  labels:
    {{- include "honeypod.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - honeypod.io
  resources:
  - alerts
  - auditsinks
  - providers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - honeypod.io
  resources:
  - decoys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - honeypod.io
  resources:
  - decoys/finalizers
  verbs:
  - update
- apiGroups:
  - honeypod.io
  resources:
  - decoys/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "honeypod.fullname" . }}-manager
  labels:
    {{- include "honeypod.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "honeypod.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "honeypod.serviceAccountName" . }}
  namespace: {{ include "honeypod.namespace" . }}
