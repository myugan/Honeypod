---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: auditsinks.honeypod.io
spec:
  group: honeypod.io
  names:
    kind: AuditSink
    listKind: AuditSinkList
    plural: auditsinks
    singular: auditsink
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.type
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AuditSink ships a Decoy's full audit event stream to a Provider such
          as Loki, for continuous analysis rather than discrete alerts. It has no
          status: nothing reconciles it, it is read when an event fires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuditSinkSpec defines where a Decoy's full, unfiltered audit stream is
              shipped -- unlike Alert, every event is forwarded (no notability filter).
            properties:
              providerRef:
                description: |-
                  ProviderRef selects a Provider in this namespace to ship events to.
                  A "discord" Provider is rejected: a chat webhook is the wrong shape
                  for a high-volume log stream.
                properties:
                  secretRef:
                    description: |-
                      SecretRef, if set, overrides the Provider's own spec.secretRef --
                      this Secret's "address" key is used instead.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  type:
                    description: |-
                      Type matches the target Provider's spec.type. Exactly one Provider
                      of this type must exist in the namespace.
                    type: string
                required:
                - type
                type: object
              targets:
                description: |-
                  Targets lists which Decoy(s) this AuditSink ships audit events for.
                  Empty means every Decoy -- the intended shape for a single-decoy
                  deployment, where one AuditSink covers the sole decoy without naming it.
                items:
                  description: |-
                    DecoyTarget names one Decoy, or every Decoy in a namespace,
                    that an Alert or AuditSink applies to.
                  properties:
                    name:
                      description: Name of the Decoy, or "*" for every Decoy in Namespace.
                      type: string
                    namespace:
                      description: |-
                        Namespace the Decoy is in. Defaults to the Alert/AuditSink's own
                        namespace.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - providerRef
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
